name: 🤖 Agents

on:
  issues:
    types: [opened, labeled, closed]
  pull_request_target:
    types: [labeled]

concurrency:
  group: agents-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

env:
  GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
  DATABASE_URL: file:./ci.db
  SESSION_SECRET: ci-only-session-secret
  GOOGLE_CLIENT_ID: ci-only
  GOOGLE_CLIENT_SECRET: ci-only
  APP_URL: http://localhost:3000

jobs:
  plan:
    name: 📝 Planner
    if: github.event_name == 'issues' && github.event.label.name == 'needs-triage' && github.event.sender.login == 'mariehmai'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AGENT_GH_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: ./package.json
          node-version: 18

      - run: npm install

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GH_TOKEN }}
          bot_id: "36398221"
          bot_name: mariehmai
          settings: '{"attribution":{"commit":"","pr":""}}'
          prompt: |
            You are the planner. Follow .github/agents/planner.md.
            Repository: ${{ github.repository }}. Issue: #${{ github.event.issue.number }}.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Write,Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(grep:*),Bash(find:*),Bash(jq:*),Bash(mkdir:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(npm outdated:*),Bash(npm audit:*),Bash(npm ls:*),Bash(npm view:*)"

      - name: Show refused commands
        if: always()
        run: |
          jq -r '.[] | select(.type == "result") | .permission_denials[]? | "\(.tool_name): \(.tool_input.command // .tool_input.file_path // "")"' "$RUNNER_TEMP/claude-execution-output.json" || true

  triage-on-open:
    name: 📥 Send new issues to the planner
    if: github.event_name == 'issues' && github.event.action == 'opened' && github.event.sender.login == 'mariehmai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add needs-triage unless the issue already has a plan or a pipeline label
        env:
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          issue=$(gh issue view "$N" -R "$REPO" --json body,labels)
          if jq -e '.body | test("(?m)^## Plan")' <<<"$issue" >/dev/null; then
            echo "#$N already has a plan, skipping"; exit 0
          fi
          if jq -e '[.labels[].name] | any(. == "needs-triage" or . == "needs-info" or . == "ready-for-agent" or . == "ready-for-human" or . == "blocked")' <<<"$issue" >/dev/null; then
            echo "#$N already has a pipeline label, skipping"; exit 0
          fi
          gh issue edit "$N" -R "$REPO" --add-label needs-triage

  unblock:
    name: 🔓 Unblock
    if: github.event_name == 'issues' && github.event.action == 'closed' && github.event.issue.state_reason == 'completed' && github.event.sender.login == 'mariehmai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Unblock issues whose blockers are all closed
        env:
          CLOSED: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue list -R "$REPO" --label blocked --state open --limit 100 --json number,body \
            | jq -c '.[] | {number, refs: [.body | scan("(?i)blocked by #([0-9]+)") | .[0]] | unique}' \
            | while read -r row; do
                n=$(jq -r .number <<<"$row")
                refs=$(jq -r '.refs[]' <<<"$row")
                grep -qx "$CLOSED" <<<"$refs" || continue
                still_open=0
                for r in $refs; do
                  [ "$(gh issue view "$r" -R "$REPO" --json state --jq .state)" = OPEN ] && still_open=1
                done
                if [ "$still_open" = 0 ]; then
                  echo "Unblocking #$n"
                  gh issue edit "$n" -R "$REPO" --remove-label blocked --add-label ready-for-agent
                fi
              done

  dev:
    name: 🛠️ Dev
    if: github.event_name == 'issues' && github.event.label.name == 'ready-for-agent' && github.event.sender.login == 'mariehmai'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AGENT_GH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: ./package.json
          node-version: 18

      - run: npm install

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GH_TOKEN }}
          bot_id: "36398221"
          bot_name: mariehmai
          settings: '{"attribution":{"commit":"","pr":""}}'
          prompt: |
            You are the dev. Follow .github/agents/dev.md.
            Repository: ${{ github.repository }}. Issue: #${{ github.event.issue.number }}.
          claude_args: >-
            --max-turns 150
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(grep:*),Bash(find:*),Bash(jq:*),Bash(mkdir:*),Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr view:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(git push origin main:*),Bash(git push --force:*),Bash(git push -f:*),Bash(npx prisma migrate dev:*),Bash(npx prisma db push:*),Bash(npm run db:migrate:*),Bash(npm run db:push:*),Bash(npm run db:reset:*)"

      - name: Show refused commands
        if: always()
        run: |
          jq -r '.[] | select(.type == "result") | .permission_denials[]? | "\(.tool_name): \(.tool_input.command // .tool_input.file_path // "")"' "$RUNNER_TEMP/claude-execution-output.json" || true

  dev-fix:
    name: 🛠️ Dev (QA fixes)
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'changes-requested' && github.event.sender.login == 'mariehmai' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AGENT_GH_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          ref: main
          path: .agents-main
          sparse-checkout: |
            .github/agents
            CLAUDE.md
          sparse-checkout-cone-mode: false

      - run: echo ".agents-main/" >> .git/info/exclude

      - uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: ./package.json
          node-version: 18

      - run: npm install

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GH_TOKEN }}
          bot_id: "36398221"
          bot_name: mariehmai
          settings: '{"attribution":{"commit":"","pr":""}}'
          prompt: |
            You are the dev, fixing QA feedback. Follow .agents-main/.github/agents/dev.md, section "Fixing QA feedback". The rules in .agents-main/CLAUDE.md apply and win over ./CLAUDE.md.
            Repository: ${{ github.repository }}. Pull request: #${{ github.event.pull_request.number }}, branch ${{ github.event.pull_request.head.ref }}.
          claude_args: >-
            --max-turns 100
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(grep:*),Bash(find:*),Bash(jq:*),Bash(mkdir:*),Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(gh issue view:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(git push origin main:*),Bash(git push --force:*),Bash(git push -f:*),Bash(npx prisma migrate dev:*),Bash(npx prisma db push:*),Bash(npm run db:migrate:*),Bash(npm run db:push:*),Bash(npm run db:reset:*)"

      - name: Show refused commands
        if: always()
        run: |
          jq -r '.[] | select(.type == "result") | .permission_denials[]? | "\(.tool_name): \(.tool_input.command // .tool_input.file_path // "")"' "$RUNNER_TEMP/claude-execution-output.json" || true

  qa:
    name: 🔍 QA
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'ready-for-qa' && github.event.sender.login == 'mariehmai' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AGENT_GH_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          ref: main
          path: .agents-main
          sparse-checkout: |
            .github/agents
            CLAUDE.md
          sparse-checkout-cone-mode: false

      - run: echo ".agents-main/" >> .git/info/exclude

      - uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: ./package.json
          node-version: 18

      - run: npm install

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GH_TOKEN }}
          bot_id: "36398221"
          bot_name: mariehmai
          settings: '{"attribution":{"commit":"","pr":""}}'
          prompt: |
            You are QA. Follow .agents-main/.github/agents/qa.md. The rules in .agents-main/CLAUDE.md apply and win over ./CLAUDE.md.
            Repository: ${{ github.repository }}. Pull request: #${{ github.event.pull_request.number }}.
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Write,Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(grep:*),Bash(find:*),Bash(jq:*),Bash(mkdir:*),Bash(npm:*),Bash(npx:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh pr ready:*)"
            --disallowedTools "Bash(npx prisma migrate dev:*),Bash(npx prisma db push:*),Bash(npm run db:migrate:*),Bash(npm run db:push:*),Bash(npm run db:reset:*),Bash(npm publish:*)"

      - name: Show refused commands
        if: always()
        run: |
          jq -r '.[] | select(.type == "result") | .permission_denials[]? | "\(.tool_name): \(.tool_input.command // .tool_input.file_path // "")"' "$RUNNER_TEMP/claude-execution-output.json" || true
